name: Apply installer native Everything metadata

on:
  push:
    branches:
      - fix/core-native-tabs-everything
    paths:
      - 'scripts/update-installer-native-everything.ps1'
      - '.github/workflows/apply-installer-native-everything.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/core-native-tabs-everything

      - name: Update installer source
        shell: powershell
        run: .\scripts\update-installer-native-everything.ps1

      - name: Review installer diff
        shell: powershell
        run: |
          git diff --check
          git diff -- InstallerMini/Installer.wxs

      - name: Commit installer metadata
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InstallerMini/Installer.wxs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Installer metadata update produced no source changes' }
          git commit -m "Prepare QTTabBar 1.5.6.2 native Everything installer"
          git push origin HEAD:fix/core-native-tabs-everything
