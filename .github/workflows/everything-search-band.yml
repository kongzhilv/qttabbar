name: Everything Search Band

on:
  push:
    branches:
      - master
      - feat/win11-native-everything-search
    paths:
      - 'EverythingSearchBand/**'
      - 'BandObjectLib/**'
      - '.github/workflows/everything-search-band.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'EverythingSearchBand/**'
      - 'BandObjectLib/**'
      - '.github/workflows/everything-search-band.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure .NET Framework 3.5 build tools
        shell: powershell
        run: |
          $msbuild = "$env:WINDIR\Microsoft.NET\Framework\v3.5\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            dism.exe /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart
          }
          if (-not (Test-Path $msbuild)) {
            throw "MSBuild 3.5 is unavailable: $msbuild"
          }
          & $msbuild -version

      - name: Build CLR2 / .NET Framework 3.5
        shell: powershell
        run: |
          $msbuild = "$env:WINDIR\Microsoft.NET\Framework\v3.5\MSBuild.exe"
          & $msbuild "EverythingSearchBand\EverythingSearchBand.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime and outputs
        shell: powershell
        run: |
          $dll = Resolve-Path "EverythingSearchBand\bin\Release\EverythingSearchBand.dll"
          $assembly = [Reflection.Assembly]::ReflectionOnlyLoadFrom($dll)
          Write-Host "Runtime: $($assembly.ImageRuntimeVersion)"
          if ($assembly.ImageRuntimeVersion -ne 'v2.0.50727') {
            throw "Expected CLR2 output, got $($assembly.ImageRuntimeVersion)"
          }
          Get-ChildItem "EverythingSearchBand\bin\Release"

      - name: Package
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'release\EverythingSearchBand'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "EverythingSearchBand\bin\Release\*.dll" $stage -Force
          Copy-Item "EverythingSearchBand\bin\Release\*.pdb" $stage -Force -ErrorAction SilentlyContinue
          Copy-Item "EverythingSearchBand\install.ps1" $stage -Force
          Copy-Item "EverythingSearchBand\uninstall.ps1" $stage -Force
          Copy-Item "EverythingSearchBand\README.md" $stage -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "release\EverythingSearchBand-v1.0.0.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverythingSearchBand-v1.0.0
          path: release/EverythingSearchBand-v1.0.0.zip
          if-no-files-found: error

      - name: Publish v1.0.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "release\EverythingSearchBand-v1.0.0.zip"
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0 $asset --clobber
          }
          else {
            gh release create v1.0.0 $asset --target "$env:GITHUB_SHA" --title "Everything Search Band v1.0.0" --notes "Standalone Everything search deskband for Windows 11 Explorer. Keeps Windows 11 native tabs and does not depend on the QTTabBar tab bar."
          }
