name: Everything Search Band

on:
  push:
    branches:
      - master
      - feat/win11-native-everything-search
    paths:
      - 'EverythingSearchBand/**'
      - '.github/workflows/everything-search-band.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'EverythingSearchBand/**'
      - '.github/workflows/everything-search-band.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET Framework 3.5 developer tools
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) { throw 'Visual Studio installation not found' }
          Write-Host "Visual Studio: $installPath"
          & $setup modify --installPath $installPath --add Microsoft.Net.Component.3.5.DeveloperTools --quiet --norestart
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          $refs = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\v3.5\System.Core.dll"
          if (-not (Test-Path $refs)) { throw ".NET Framework 3.5 reference assemblies not found: $refs" }

      - name: Build CLR2 / .NET Framework 3.5
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          Write-Host "MSBuild: $msbuild"
          & $msbuild "EverythingSearchBand\EverythingSearchBand.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime and outputs
        shell: powershell
        run: |
          $dll = Resolve-Path "EverythingSearchBand\bin\Release\EverythingSearchBand.dll"
          $assembly = [Reflection.Assembly]::ReflectionOnlyLoadFrom($dll)
          Write-Host "Runtime: $($assembly.ImageRuntimeVersion)"
          if ($assembly.ImageRuntimeVersion -ne 'v2.0.50727') {
            throw "Expected CLR2 output, got $($assembly.ImageRuntimeVersion)"
          }
          $refs = $assembly.GetReferencedAssemblies()
          $bad = @($refs | Where-Object { $_.Name -eq 'BandObjectLib' })
          if ($bad.Count -gt 0) {
            throw 'EverythingSearchBand must be self-contained and must not reference BandObjectLib.dll'
          }
          Get-ChildItem "EverythingSearchBand\bin\Release"

      - name: Package
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'release\EverythingSearchBand'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "EverythingSearchBand\bin\Release\EverythingSearchBand.dll" $stage -Force
          Copy-Item "EverythingSearchBand\bin\Release\EverythingSearchBand.pdb" $stage -Force -ErrorAction SilentlyContinue
          Copy-Item "EverythingSearchBand\install.ps1" $stage -Force
          Copy-Item "EverythingSearchBand\uninstall.ps1" $stage -Force
          Copy-Item "EverythingSearchBand\README.md" $stage -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "release\EverythingSearchBand-v1.0.0.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverythingSearchBand-v1.0.0
          path: release/EverythingSearchBand-v1.0.0.zip
          if-no-files-found: error

      - name: Publish v1.0.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "release\EverythingSearchBand-v1.0.0.zip"
          $ErrorActionPreference = 'Continue'
          gh release create v1.0.0 $asset --target "$env:GITHUB_SHA" --title "Everything Search Band v1.0.0" --notes "Standalone Everything search deskband for Windows 11 Explorer. Keeps Windows 11 native tabs and does not depend on the QTTabBar tab bar." 2>$null
          $createExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($createExit -ne 0) {
            gh release upload v1.0.0 $asset --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
