name: Apply core native tabs + Everything patch

on:
  push:
    branches:
      - fix/core-native-tabs-everything
    paths:
      - 'scripts/apply-core-native-tabs-everything.ps1'
      - '.github/workflows/apply-core-native-tabs-everything.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/core-native-tabs-everything

      - name: Apply source patch
        shell: powershell
        run: .\scripts\apply-core-native-tabs-everything.ps1

      - name: Review generated diff
        shell: powershell
        run: |
          git diff --check
          git diff -- QTTabBar/QTButtonBar.cs QTTabBar/QTTabBarClass.cs QTTabBar/AutoLoader.cs

      - name: Commit core integration
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QTTabBar/QTButtonBar.cs QTTabBar/QTTabBarClass.cs QTTabBar/AutoLoader.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Patch produced no source changes' }
          git commit -m "Integrate Everything search into QTTabBar core"
          git push origin HEAD:fix/core-native-tabs-everything
